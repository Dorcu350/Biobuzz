repositories {
    mavenCentral()
    google() // Recomandat pentru androidx

    maven { url = 'https://maven.pedropathing.com' }
    maven { url = "https://mymaven.bylazar.com/releases" }
    maven { url = 'https://jitpack.io' }

    maven { url = "https://repo.dairy.foundation/releases" }
    maven { url = "https://repo.dairy.foundation/snapshots" }

    maven { url = 'https://maven.brott.dev/' }
}

dependencies {
    // FTC SDK (Folosește o singură versiune - ex: 12.0.0 sau 11.2.0 în funcție de robotul tău)
    implementation 'org.firstinspires.ftc:Inspection:12.0.0'
    implementation 'org.firstinspires.ftc:Blocks:12.0.0'
    implementation 'org.firstinspires.ftc:RobotCore:12.0.0'
    implementation 'org.firstinspires.ftc:RobotServer:12.0.0'
    implementation 'org.firstinspires.ftc:OnBotJava:12.0.0'
    implementation 'org.firstinspires.ftc:Hardware:12.0.0'
    implementation 'org.firstinspires.ftc:FtcCommon:12.0.0'
    implementation 'org.firstinspires.ftc:Vision:12.0.0'

    // AndroidX
    implementation 'androidx.appcompat:appcompat:1.2.0'

    // FTC Dashboard
    implementation('com.acmerobotics.dashboard:dashboard:0.5.0') {
        exclude group: 'org.firstinspires.ftc'
    }

    // Pedro Pathing (Versiunea 3.x)
    implementation 'com.pedropathing:revhub:3.0.2'
    implementation 'com.pedropathing:tuning:1.0.0'

    // ByLazar Panels & Graphing
    implementation 'com.bylazar:fullpanels:1.0.15'
//    implementation 'com.bylazar:fullpanels:1.0.19'
//    implementation "com.bylazar:docs:1.0.9"

    // Homeostasis & FTCLib
    implementation 'com.github.Thermal-Equilibrium:homeostasis-FTC:1.0.8'
    implementation 'org.ftclib.ftclib:core:2.1.1'

    // Dairy CachingHardware
    implementation "dev.frozenmilk.dairy:CachingHardware:1.0.0"
}